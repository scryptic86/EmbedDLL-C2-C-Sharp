# Auto-convert EmbedDLL_C2_Dropper-Loader_FINAL.docx -> README.md
# Triggers:
#  - when the DOCX is changed
#  - manually via "Run workflow"
on:
  push:
    paths:
      - 'EmbedDLL_C2_Dropper-Loader_FINAL.docx'
      - '.github/workflows/docx-to-readme.yml'
  workflow_dispatch: {}

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Convert DOCX → README.md (extract media to docx-media/)
        run: |
          DOCX="EmbedDLL_C2_Dropper-Loader_FINAL.docx"
          OUT="README.md"
          MEDIA_DIR="docx-media"
          # remove previous extracted media to avoid stale files
          rm -rf "$MEDIA_DIR"
          # convert to GitHub-flavored Markdown and extract media
          pandoc -f docx -t gfm "$DOCX" --extract-media="$MEDIA_DIR" -o "$OUT"
          # fail if conversion produced no README (catch errors)
          test -s "$OUT"

          # stage generated files (README and media if present)
          git add "$OUT" || true
          if [ -d "$MEDIA_DIR" ]; then
            git add "$MEDIA_DIR" || true
          fi

      - name: Commit & push converted README
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          # only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Auto-convert DOCX to README.md"
          git push